name: Publish Helm OCI chart

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write
  packages: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate component standard and release version
        run: python scripts/validate_component_standard.py --release-version "$GITHUB_REF_NAME"
      - name: Validate chart version
        run: test "v$(helm show chart charts/re8ch-advanced-fabric | awk '/^version:/{print $2}')" = "$GITHUB_REF_NAME"
      - run: helm lint charts/re8ch-advanced-fabric
      - run: helm package charts/re8ch-advanced-fabric --destination dist
      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable chart
        id: push
        run: |
          output=$(helm push dist/advanced-fabric-*.tgz oci://ghcr.io/advanced-fabrics/charts)
          printf '%s\n' "$output"
          digest=$(printf '%s\n' "$output" | awk '$1 == "Digest:" {print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable chart release
        env: {DIGEST: '${{ steps.push.outputs.digest }}'}
        run: cosign sign --yes "ghcr.io/advanced-fabrics/charts/advanced-fabric@$DIGEST"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/advanced-fabric.spdx.json
      - name: Sign and checksum Helm release asset
        run: |
          chart=$(find dist -name 'advanced-fabric-*.tgz' -print -quit)
          test -n "$chart"
          cosign sign-blob --yes --bundle "${chart}.bundle.json" "$chart"
          (cd dist && sha256sum "$(basename "$chart")" > "$(basename "$chart").sha256")
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/advanced-fabric-*.tgz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/advanced-fabric-*.tgz
            dist/advanced-fabric-*.tgz.sha256
            dist/advanced-fabric-*.tgz.bundle.json
            dist/advanced-fabric.spdx.json
