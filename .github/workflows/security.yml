name: Security governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate declared dependencies and immutable references
        run: python scripts/validate_component_standard.py
