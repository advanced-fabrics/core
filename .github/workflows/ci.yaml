name: Chart CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_component_standard.py
      - run: helm lint charts/re8ch-advanced-fabric
      - run: helm template advanced-fabric charts/re8ch-advanced-fabric --namespace advanced-fabric >/dev/null
      - name: Render external MVP profile
        run: >-
          helm template advanced-fabric charts/re8ch-advanced-fabric
          --namespace advanced-fabric
          --values examples/mvp-values.yaml >/dev/null
      - name: Render network quality and DNS shadow provider
        run: >-
          helm template advanced-fabric charts/re8ch-advanced-fabric --namespace kube-system
          --set advancedFabric.enabled=true
          --set advancedFabric.networkQuality.enabled=true
          --set advancedFabric.networkQuality.dns.shadowEnabled=true
          --set advancedFabric.networkQuality.doh.enabled=true >/dev/null
      - name: Render authoritative Advanced Fabric DNS
        run: >-
          helm template advanced-fabric charts/re8ch-advanced-fabric --namespace kube-system
          --set advancedFabric.enabled=true
          --set advancedFabric.dns.enabled=true
          --set advancedFabric.dns.migration.phase=active >/dev/null
